[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
swc_visualizer = ["examples/*.swc"]

[project]
name = "swc-visualizer"
version = "0.1.1"
dependencies = [
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "plotly>=6.6.0",
    "pytest>=9.1.1",
]
requires-python = ">=3.11"
authors = [
  {name = "Daniel Moreno", email = "xx8203914@gmail.com"},
]
description = "Validation, summaries, and 2D/3D visualization of SWC files"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
keywords = ["morphology", "neuron", "neurons", "neuroscience", "visualizer", "plotly", "swc", "tree"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
swc-visualizer = "swc_visualizer.main:main"

[project.urls]
Homepage = "https://github.com/danieljosemoca/swc-visualizer"
Repository = "https://github.com/danieljosemoca/swc-visualizer.git"
Issues = "https://github.com/danieljosemoca/swc-visualizer/issues"
